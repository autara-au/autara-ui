# Typecheck, test and build on every PR and every push to main.
#
# AUTM-713 — this repo had tests (vitest, with a 100% threshold on cn.ts) and
# a build, but NO workflow ran either on a pull request. The only workflow was
# Release, which fires after main already moved. In practice a PR's only
# checks were org-level CodeQL, so a red build or a failing test could not
# block a merge — and this is the package every web surface renders through.
#
# That gap is also why the preset/token drift this ticket fixes survived: the
# guard test added alongside it would have had nothing running it.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # AUTM-1434: replaces release.yml's own workflow_dispatch. Dispatched on
  # main it runs validate and then the release; elsewhere, validate only.
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # AUTM-1434: PR runs only. A main run now carries the release, and
  # cancelling it partway could leave a tag pushed with no package behind it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    # AUTM-1434: the default is 360 minutes. Install, typecheck, test and build
    # measured ~40s locally; 15 leaves room for a cold cache and a slow runner
    # while stopping a hung install from burning six hours of the quota.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # `version` is required — package.json has no `packageManager` field, so
      # the action cannot infer it and fails outright. Pinned to 9 to match
      # release.yml; if one moves, move both.
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      # After pnpm, because `cache: pnpm` needs the binary to resolve the
      # store path. Registry config mirrors release.yml so a scoped @autara-au
      # dependency resolves here too.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          registry-url: "https://npm.pkg.github.com"
          scope: "@autara-au"

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      # Last, because it is the slowest and the least likely to be the thing
      # that broke.
      - name: Build
        run: pnpm run build

  # AUTM-1434 — Release used to be its own workflow on push to main, running
  # IN PARALLEL with this one, so a red build or a failing test here did not
  # stop the package every web surface renders through from publishing. It now
  # runs only after validate passes, in the same run, on the same commit, by
  # calling release.yml (unchanged apart from its trigger).
  #
  # Why `needs:` + a local reusable workflow, not `workflow_run`:
  #  - `needs:` guarantees the released commit is the one validated. A
  #    workflow_run release checks out the default branch as it is when the
  #    second workflow starts, which can already be a newer, untested commit.
  #  - GITHUB_TOKEN behaves exactly as before. A called workflow gets the
  #    caller's token, capped at the permissions granted on this job, which
  #    are the four release.yml's job already declared. semantic-release still
  #    sees a push event on refs/heads/main.
  #  - It can be read and exercised from a PR: workflow_run only ever fires
  #    from the copy of the file on the default branch.
  release:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
      packages: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/release.yml
    secrets: inherit
